name: Neoforge

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        java: [25]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'gradle'

      - name: Ensure gradlew is executable (Unix)
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Build neoforge subproject (Unix)
        if: runner.os != 'Windows'
        run: ./gradlew :neoforge:build --no-daemon

      - name: Build neoforge subproject (Windows)
        if: runner.os == 'Windows'
        run: .\\gradlew.bat :neoforge:build --no-daemon
